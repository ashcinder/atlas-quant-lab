worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Do not write query strings, request bodies, or developer tokens to logs.
    log_format minimal '$remote_addr $request_method $uri $status $body_bytes_sent';
    access_log /dev/stdout minimal;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30;
    client_body_timeout 30s;
    client_max_body_size 20m;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 'ok\n';
        }

        # Swagger at /api/docs also fetches FastAPI's /openapi.json.
        location ~ ^/(api(?:/|$)|openapi\.json$) {
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection '';
            proxy_connect_timeout 5s;
            proxy_read_timeout 300s;
            proxy_send_timeout 60s;
            proxy_cache off;
        }

        location /assets/ {
            try_files $uri =404;
            expires 1y;
        }

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control 'no-cache' always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy no-referrer always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://cdn.jsdelivr.net/npm/@tesseract.js-data/; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        }
    }
}
