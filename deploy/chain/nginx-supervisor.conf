worker_processes 1;
pid /tmp/nginx-supervisor.pid;
error_log /dev/stderr warn;

events { worker_connections 128; }

http {
    access_log off;
    server_tokens off;
    client_max_body_size 256k;
    client_body_timeout 10s;
    client_body_temp_path /tmp/supervisor-client-body;
    proxy_temp_path /tmp/supervisor-proxy;
    fastcgi_temp_path /tmp/supervisor-fastcgi;
    uwsgi_temp_path /tmp/supervisor-uwsgi;
    scgi_temp_path /tmp/supervisor-scgi;

    server {
        listen 42515;

        allow 127.0.0.1;
        allow __ATLAS_API_IP__;
        deny all;

        location / {
            proxy_pass http://127.0.0.1:42519;
            proxy_http_version 1.1;
            proxy_set_header Host supervisor;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Connection '';
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_send_timeout 10s;
            proxy_buffering off;
        }
    }
}
