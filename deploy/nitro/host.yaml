AWSTemplateFormatVersion: '2010-09-09'
Description: Atlas Nitro parent host. KMS ownership deliberately remains in the author account.
Parameters:
  AuthorAccount:
    Type: String
    AllowedPattern: '[0-9]{12}'
  SubnetId:
    Type: AWS::EC2::Subnet::Id
  VpcId:
    Type: AWS::EC2::VPC::Id
  ImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
Resources:
  HostRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: AuthorApprovedDecryptOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: kms:Decrypt
                Resource: !Sub 'arn:aws:kms:${AWS::Region}:${AuthorAccount}:key/*'
  Profile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref HostRole]
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: No inbound access; SSM administration only
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
  Host:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: c6i.xlarge
      ImageId: !Ref ImageId
      SubnetId: !Ref SubnetId
      SecurityGroupIds: [!Ref SecurityGroup]
      IamInstanceProfile: !Ref Profile
      EnclaveOptions: {Enabled: true}
      MetadataOptions: {HttpTokens: required, HttpEndpoint: enabled}
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: {VolumeSize: 40, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true}
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euo pipefail
          dnf install -y docker aws-nitro-enclaves-cli aws-nitro-enclaves-cli-devel python3.11 python3.11-pip git
          systemctl enable --now docker
          printf 'memory_mib: 2048\ncpu_count: 2\n' > /etc/nitro_enclaves/allocator.yaml
          systemctl enable --now nitro-enclaves-allocator.service
Outputs:
  InstanceId: {Value: !Ref Host}
  PlatformRoleArn: {Value: !GetAtt HostRole.Arn}
