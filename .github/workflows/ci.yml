name: Verify private deployment

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip check
      # conftest replaces all store paths before importing application modules.
      - run: python -m pytest

  containers:
    needs: [frontend, backend]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'
      - run: docker compose config --quiet
      # Builds and destroys only a unique disposable project. No deployment,
      # registry push, production database, real market feed, or secrets involved.
      - run: python deploy/smoke.py

  isolated-runner:
    needs: [frontend, backend]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'
      - run: python -m pip install -r backend/requirements.lock
      - name: Install checksum-pinned gVisor in the disposable CI VM
        run: |
          curl --fail --location --max-time 120 --output /tmp/gvisor.tar.bz2 https://github.com/google/gvisor/releases/download/release-20260831.0/gvisor-x86_64.tar.bz2
          echo '014b3871a5c698c802fd7a03758e0dbf4c1683f9e3f8c743979ea66bbf6553a4  /tmp/gvisor.tar.bz2' | sha256sum --check
          mkdir /tmp/atlas-gvisor
          tar -xjf /tmp/gvisor.tar.bz2 -C /tmp/atlas-gvisor
          runner_bin=$(find /tmp/atlas-gvisor -name runsc -type f)
          test -x "$runner_bin"
          sudo mkdir -p /opt/atlas-gvisor
          sudo cp -a "$(dirname "$runner_bin")/." /opt/atlas-gvisor/
          sudo /opt/atlas-gvisor/runsc install
          sudo systemctl reload docker
      - name: Build and test the real sandbox
        run: |
          docker build -f deploy/runner.Dockerfile -t atlas-runner-ci .
          export ATLAS_RUNNER_ENABLED=1
          export ATLAS_RUNNER_IMAGE=$(docker image inspect atlas-runner-ci --format '{{.Id}}')
          export ATLAS_RUNNER_SOCKET=/var/run/docker.sock
          python deploy/runner_smoke.py
