name: Atlas validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run lint -- --max-warnings=0
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements*.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: contracts
      - run: python -m pip install -r backend/requirements-dev.lock
      - run: python -m pip check
      - run: python -m pytest --junitxml=../backend-results.xml
        working-directory: backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-results-${{ matrix.python }}
          path: backend-results.xml
